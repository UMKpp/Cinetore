<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Genres | CINETORE</title>
    <link rel="icon" type="image/x-icon" href="images/favicon.png">
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/home.css">
    <link rel="stylesheet" href="css/genres.css">
</head>

<body>
    <nav class="navbar cinetore-navbar">
        <div class="container-fluid">
            <div class="navbar-header">
                <button type="button" class="navbar-toggle collapsed" data-toggle="collapse"
                    data-target="#cinetore-navbar" aria-expanded="false">
                    <span class="sr-only">Toggle navigation</span>
                    <span class="icon-bar"></span>
                    <span class="icon-bar"></span>
                    <span class="icon-bar"></span>
                </button>
                <a class="navbar-brand cinetore-logo" href="index.html">CINETORE</a>
            </div>
            <div class="collapse navbar-collapse" id="cinetore-navbar">
                <ul class="nav navbar-nav navbar-right">
                    <li><a href="genre.html">Genre</a></li>
                    <li><button id="themeToggle" class="theme-toggle" type="button" aria-label="Toggle theme"><i
                                id="themeIcon" class="fa-solid fa-sun"></i></button></li>
                </ul>
            </div>
        </div>
    </nav>

    <main class="genre-page">
        <div class="container">
            <header class="genre-header">
                <h1>Explore Movies by Genre</h1>
                <div class="genre-filter-bar" role="group" aria-label="Filter movies by genre">
                    <button type="button" class="genre-filter-button" data-genre="All" aria-pressed="false">All</button>
                    <button type="button" class="genre-filter-button" data-genre="Action"
                        aria-pressed="false">Action</button>
                    <button type="button" class="genre-filter-button" data-genre="Sci-Fi"
                        aria-pressed="false">Sci-Fi</button>
                    <button type="button" class="genre-filter-button" data-genre="Drama"
                        aria-pressed="false">Drama</button>
                    <button type="button" class="genre-filter-button" data-genre="RomCom"
                        aria-pressed="false">RomCom</button>
                    <button type="button" class="genre-filter-button" data-genre="Animation"
                        aria-pressed="false">Animation</button>
                    <button type="button" class="genre-filter-button" data-genre="Horror"
                        aria-pressed="false">Horror</button>
                </div>
            </header>
            <div id="genreMovieGrid" class="genre-movie-grid"></div>
            <p id="genreEmptyState" class="genre-empty-state" hidden>No movies available in this genre yet.</p>
        </div>
    </main>

    <div class="floating-actions">
        <button type="button" class="floating-cta" id="requestMovieBtn" aria-label="Request Movie">
            <i class="fa-solid fa-film"></i><span class="cta-label">Request Movie</span>
        </button>
    </div>

    <footer class="cinetore-footer">
        <div class="container">© 2026 Cinetore. All rights reserved.</div>
    </footer>

    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <script src="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/js/bootstrap.min.js"></script>
    <script src="js/app.js"></script>
</body>

</html>
